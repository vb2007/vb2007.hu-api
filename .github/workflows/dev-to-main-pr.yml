name: Open Dev to Main PR

on:
  workflow_dispatch:
  push:
    branches: [dev]

concurrency:
  group: dev-to-main-pr
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: "24"
  ASSIGNEE: vb2007

jobs:
  open-pr:
    name: Open PR
    runs-on: [self-hosted, Linux, X64]
    env:
      GH_TOKEN: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Find the open dev -> main PR
        id: existing
        run: |
          gh pr list --base main --head dev --state open --json number,url \
            --jq '.[0] // {} | "number=\(.number // "")\nurl=\(.url // "")"' >> "$GITHUB_OUTPUT"

      - name: No PR to refresh
        if: github.event_name == 'push' && steps.existing.outputs.url == ''
        run: echo "::notice::No dev -> main PR is open, so there's no description to refresh."

      - name: Build the PR description
        id: body
        if: github.event_name == 'workflow_dispatch' || steps.existing.outputs.url != ''
        run: node .github/scripts/dev-to-main-body.mjs "$RUNNER_TEMP/pr-body.md"

      # REST rather than `gh pr edit`, which fails on some gh versions over the
      # retired Projects (classic) fields.
      - name: Refresh the PR description
        if: steps.existing.outputs.url != ''
        env:
          PR_NUMBER: ${{ steps.existing.outputs.number }}
          PR_URL: ${{ steps.existing.outputs.url }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            -F "body=@${{ steps.body.outputs.body_file }}" --silent
          echo "::notice::Refreshed the description of $PR_URL."

      - name: Open the PR
        id: open
        if: github.event_name == 'workflow_dispatch' && steps.existing.outputs.url == '' && steps.body.outputs.count != '0'
        env:
          HAS_PR_TOKEN: ${{ secrets.PR_TOKEN != '' }}
        run: |
          if [ "$HAS_PR_TOKEN" != "true" ]; then
            echo "::warning::PR_TOKEN is not set, so GITHUB_TOKEN opens the PR and the PR checks won't run on it."
          fi
          status=0
          output=$(gh pr create --base main --head dev \
            --title "Merge dev To main" \
            --body-file "${{ steps.body.outputs.body_file }}" \
            --assignee "$ASSIGNEE" 2>&1) || status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "url=$(tail -n 1 <<< "$output")" >> "$GITHUB_OUTPUT"
          elif grep -q "not permitted to create or approve pull requests" <<< "$output"; then
            echo '::error::GitHub Actions is not allowed to open PRs here. Add a PR_TOKEN secret (a fine-grained PAT for this repo with Pull requests: read/write and Contents: read), or turn on Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests". Only PR_TOKEN makes the PR checks run.'
          fi
          exit "$status"

      # One marked comment, so later runs find it: posted while package.json's
      # version is unbumped, updated when the release it names changes, and
      # deleted once the version is bumped on dev.
      - name: Sync the version warning
        if: steps.open.outputs.url != '' || steps.existing.outputs.url != ''
        env:
          PR_URL: ${{ steps.open.outputs.url || steps.existing.outputs.url }}
          MARKER: "<!-- dev-to-main-version-warning -->"
        run: |
          comments="repos/$GITHUB_REPOSITORY/issues/${PR_URL##*/}/comments"
          ids=$(gh api --paginate "$comments" --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id")
          warning=$(node .github/scripts/version-bump-warning.mjs)
          if [ -z "$warning" ]; then
            for id in $ids; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id" --silent
              echo "::notice::package.json was bumped, so the version warning on $PR_URL was removed."
            done
            exit 0
          fi
          echo "::warning::$warning"
          body=$(printf '%s\n%s' "$MARKER" "$warning")
          id=$(head -n 1 <<< "$ids")
          if [ -z "$id" ]; then
            if ! gh api "$comments" -f body="$body" --silent; then
              echo "::error::Commenting the version warning on $PR_URL failed."
              exit 1
            fi
          elif [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body)" != "$body" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" --silent
          fi

      - name: Nothing to merge
        if: steps.existing.outputs.url == '' && steps.body.outputs.count == '0'
        run: echo "::notice::main already has every PR merged into dev, so no PR was opened."
