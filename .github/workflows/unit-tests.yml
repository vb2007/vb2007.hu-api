name: API Unit Tests

on:
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  test:
    name: Run API Unit Tests
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Pick a free port for this job's API
        run: |
          API_PORT=$(node -e 'const server = require("net").createServer().listen(0, "localhost", () => { console.log(server.address().port); server.close(); });')
          echo "API_PORT=$API_PORT" >> $GITHUB_ENV
          echo "API will listen on port $API_PORT"

      - name: Create a .env file and set it's values
        env:
          TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          echo "APP_IP=localhost" > .env
          echo "APP_PORT=$API_PORT" >> .env
          echo "COOKIE_TARGET_DOMAIN=localhost" >> .env
          echo 'DB_CONNECTION_STRING=${{ secrets.DB_CONNECTION_STRING }}' >> .env
          echo "CORS_ORIGIN_URLS=http://localhost:$API_PORT" >> .env
          echo "BASE_SITE_URL=https://vb2007.hu" >> .env
          echo 'CRYPTO_SECRET_KEY=${{ secrets.CRYPTO_SECRET_KEY }}' >> .env
          echo "TEST_RUN_ID=$TEST_RUN_ID" >> .env
          echo "SUPERUSER_EMAIL=superuser@$TEST_RUN_ID.vb2007.test" >> .env
          echo "CDN_URL=https://cdn.vb2007.hu" >> .env
          echo "UPLOAD_DISK_DIRECTORY=${{ runner.temp }}/uploads" >> .env
          echo "UPLOAD_MAX_FILESIZE=10" >> .env
          echo "GITHUB_CLIENT_ID=ci-client-id" >> .env
          echo "GITHUB_CLIENT_SECRET=ci-client-secret" >> .env
          echo "GITHUB_CALLBACK_URL=http://localhost:$API_PORT/auth/github/callback" >> .env
          # Upload settings will be added when upload tests are written

      - name: Build the application's current version
        run: corepack yarn build

      - name: Start the API service
        run: |
          node ./dist/index.js &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV

          # Waiting for the API to start
          MAX_RETRIES=8
          RETRY_COUNT=0
          echo "Waiting for API to be ready..."

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if ! kill -0 "$API_PID" 2> /dev/null; then
              echo "API exited before it was ready"
              exit 1
            fi

            if ss -ltnpH "sport = :$API_PORT" | grep -q "pid=$API_PID," &&
              curl -sf "http://localhost:$API_PORT/healthz" > /dev/null; then
              echo "API is ready!"
              break
            fi

            echo "API not ready yet, retrying in 3s..."
            sleep 3
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "API failed to start within the timeout period"
            exit 1
          fi

      - name: Run unit tests
        run: corepack yarn test

      - name: Name the JUnit report
        if: always()
        run: |
          mkdir -p reports
          cp src/tests/reports/junit.xml reports/junit-unit-tests-${{ github.run_number }}.xml || true

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: reports/junit-unit-tests-${{ github.run_number }}.xml
          archive: false
          retention-days: 14
          if-no-files-found: warn

      - name: Shut down the API service
        if: always()
        run: |
          if [ -n "${{ env.API_PID }}" ]; then
            echo "Shutting down API service (PID: ${{ env.API_PID }})"
            kill ${{ env.API_PID }} || true
          fi

  reports:
    name: Generate reports
    needs: [test]
    if: always()
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install report generator dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Download JUnit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: artifacts

      - name: Generate HTML/ODS/summary reports
        working-directory: .github/scripts
        run: |
          node junit-report.mjs \
            --input "${{ github.workspace }}/artifacts" \
            --out "${{ github.workspace }}/test-reports" \
            --suffix "${{ github.run_number }}"

      - name: Publish job summary
        run: cat "test-reports/summary-${{ github.run_number }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report.html
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/report-${{ github.run_number }}.html
          archive: false
          retention-days: 30

      - name: Upload report.ods
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/report-${{ github.run_number }}.ods
          archive: false
          retention-days: 30

      - name: Upload summary.md
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/summary-${{ github.run_number }}.md
          archive: false
          retention-days: 30

      - name: Upload summary.json
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/summary-${{ github.run_number }}.json
          archive: false
          retention-days: 30
