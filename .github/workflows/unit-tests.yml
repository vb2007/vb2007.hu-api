name: API Unit Tests

on:
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run API Unit Tests
    runs-on: [self-hosted, ci]
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Create a .env file and set it's values
        env:
          TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CI_DB_CONNECTION_STRING: ${{ secrets.CI_DB_CONNECTION_STRING }}
        run: |
          CRYPTO_SECRET_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$CRYPTO_SECRET_KEY"
          echo "APP_IP=127.0.0.1" > .env
          echo "DB_CONNECTION_STRING=$CI_DB_CONNECTION_STRING" >> .env
          echo "BASE_SITE_URL=https://vb2007.hu" >> .env
          echo "CRYPTO_SECRET_KEY=$CRYPTO_SECRET_KEY" >> .env
          echo "TEST_RUN_ID=$TEST_RUN_ID" >> .env
          echo "SUPERUSER_EMAIL=superuser@$TEST_RUN_ID.vb2007.test" >> .env
          echo "CDN_URL=https://cdn.vb2007.hu" >> .env
          echo "UPLOAD_DISK_DIRECTORY=${{ runner.temp }}/uploads" >> .env
          echo "UPLOAD_MAX_FILESIZE=10" >> .env
          echo "GITHUB_CLIENT_ID=ci-client-id" >> .env
          echo "GITHUB_CLIENT_SECRET=ci-client-secret" >> .env

      - name: Build the application's current version
        run: corepack yarn build

      # The ci runners share one host with the test MongoDB, so only one job runs the API and Jest at a time.
      # The holder exits with Runner.Worker (the step's parent), so a dead runner never keeps the lock.
      - name: Wait for the ci host test lock
        run: |
          LOCK_FILE=/var/tmp/vb2007hu-api-unit-tests.lock
          echo "Runner $RUNNER_NAME on $(uname -n) as $(id -un), parent $(ps -o comm= -p $PPID), lock $LOCK_FILE"

          [ -e "$LOCK_FILE" ] || : >> "$LOCK_FILE" || true
          if [ ! -r "$LOCK_FILE" ]; then
            echo "::warning::Can't open $LOCK_FILE, running without the ci host test lock"
            exit 0
          fi
          if ! command -v flock > /dev/null; then
            echo "::warning::flock isn't installed, running without the ci host test lock"
            exit 0
          fi
          exec 9< "$LOCK_FILE"

          if ! flock -n 9; then
            echo "Another unit-test job holds the ci host test lock, waiting up to 30 minutes..."
            if ! flock -w 1800 9; then
              echo "::error::Timed out waiting for the ci host test lock"
              exit 1
            fi
          fi
          echo "Acquired the ci host test lock"

          nohup sh -c 'while kill -0 "$1" 2> /dev/null; do sleep 5 9<&-; done' sh "$PPID" < /dev/null > /dev/null 2>&1 &
          echo "TEST_LOCK_PID=$!" >> $GITHUB_ENV

      - name: Start the API service
        run: .github/scripts/start-api.sh

      - name: Run unit tests
        run: corepack yarn test

      - name: Run the GitHub login tests without GitHub login configured
        env:
          API_LOG_NAME: api-github-unconfigured.log
          JEST_JUNIT_OUTPUT_NAME: junit-github-unconfigured.xml
        run: |
          kill "$API_PID"
          sed -i '/^GITHUB_CLIENT_\(ID\|SECRET\)=/d' .env
          .github/scripts/start-api.sh
          if ! curl -s -o /dev/null -w '%{redirect_url}' "http://127.0.0.1:$(sed -n 's/^APP_PORT=//p' .env)/auth/github" | grep -q 'oauthError=notConfigured'; then
            echo "::error::The API still has GitHub login configured, so the tests without it would only skip"
            exit 1
          fi
          corepack yarn test src/tests/github.test.ts

      - name: Name the JUnit report
        if: always()
        run: |
          mkdir -p reports
          cp src/tests/reports/junit.xml reports/junit-unit-tests-${{ github.run_number }}.xml || true
          cp src/tests/reports/junit-github-unconfigured.xml reports/junit-github-unconfigured-${{ github.run_number }}.xml || true

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: reports/junit-unit-tests-${{ github.run_number }}.xml
          archive: false
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the JUnit report without GitHub login configured
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: reports/junit-github-unconfigured-${{ github.run_number }}.xml
          archive: false
          retention-days: 14
          if-no-files-found: warn

      - name: Shut down the API service
        if: always()
        run: |
          if [ -n "${{ env.API_PID }}" ]; then
            echo "Shutting down API service (PID: ${{ env.API_PID }})"
            kill ${{ env.API_PID }} || true
          fi

      - name: Release the ci host test lock
        if: always()
        run: |
          if [ -n "$TEST_LOCK_PID" ]; then
            kill "$TEST_LOCK_PID" || true
            echo "Released the ci host test lock"
          fi

  reports:
    name: Generate reports
    needs: [test]
    if: always()
    runs-on: [self-hosted, ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install report generator dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Download JUnit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: artifacts

      - name: Generate HTML/ODS/summary reports
        working-directory: .github/scripts
        run: |
          node junit-report.mjs \
            --input "${{ github.workspace }}/artifacts" \
            --out "${{ github.workspace }}/test-reports" \
            --suffix "${{ github.run_number }}"

      - name: Publish job summary
        run: cat "test-reports/summary-${{ github.run_number }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report.html
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/report-${{ github.run_number }}.html
          archive: false
          retention-days: 30

      - name: Upload report.ods
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/report-${{ github.run_number }}.ods
          archive: false
          retention-days: 30

      - name: Upload summary.md
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/summary-${{ github.run_number }}.md
          archive: false
          retention-days: 30

      - name: Upload summary.json
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/summary-${{ github.run_number }}.json
          archive: false
          retention-days: 30
