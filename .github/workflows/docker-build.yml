name: Docker Build

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: [self-hosted, ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha

      - name: Export cache
        uses: docker/build-push-action@v7
        timeout-minutes: 5
        continue-on-error: true
        with:
          context: .
          push: false
          cache-to: type=gha,mode=max,ignore-error=true,timeout=2m
