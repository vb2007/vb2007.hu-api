# conf.d files are included in the http context, where map has to live
map $upload_visibility $upload_cache_control {
    public  "public, max-age=300";
    default "private, no-store";
}

server {
    listen 8080;

    server_tokens off;
    server_name cdn.vb2007.hu;

    location /autoindex/ {
        autoindex on;
        autoindex_exact_size on;
        #autoindex_format html;
        #add_before_body /var/www/html/header.html;
        #add_after_body /var/www/html/footer.html;
    }

    location ^~ /useruploads/ {
        autoindex off;

        auth_request /_upload_access;
        auth_request_set $upload_visibility $upstream_http_x_upload_visibility;
        auth_request_set $upload_filename $upstream_http_x_upload_filename;

        # Denied and missing look the same, so nobody can probe for private files
        error_page 401 403 =404 /_upload_404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control $upload_cache_control always;
        add_header Content-Disposition "inline; filename*=$upload_filename" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;

        try_files $uri =404;
    }

    location = /_upload_access {
        internal;
        proxy_pass http://127.0.0.1:3000/uploads/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location = /_upload_404 {
        internal;
        add_header Cache-Control "private, no-store" always;
        return 404;
    }

    root /mnt/raid1/cdn;
}
